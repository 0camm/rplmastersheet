<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RPL Salary Caps</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter';}

body{
    background:#f8fafc;
    color:#111;
}

/* HEADER */
header{
    padding:30px;
    text-align:center;
}

header h1{
    font-size:42px;
    font-weight:900;
}

/* STATS */
.stats{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:20px 30px;
    border-radius:16px;
    border:1px solid #eee;
    text-align:center;
}

.stat h2{font-size:26px;}
.stat p{color:#666;}

/* TEAM CAP */
.team-section{
    margin:30px;
}

.team-card{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
    border:1px solid #eee;
    cursor:pointer;
    transition:.25s;
}

.team-card:hover{
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.team-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.progress{
    height:10px;
    background:#eee;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    background:#ef4444;
}

/* PLAYERS */
.players{
    margin-top:15px;
    display:none;
}

.player{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #eee;
}

.free-agent{
    color:#ef4444;
    font-weight:700;
}

/* SEARCH */
.search{
    width:90%;
    margin:auto;
    display:block;
    padding:15px;
    border-radius:12px;
    border:1px solid #ddd;
    margin-bottom:20px;
}
</style>
</head>

<body>

<header>
    <h1>RPL Salary Cap System</h1>
</header>

<div class="stats">
    <div class="stat">
        <h2>$58M</h2>
        <p>Team Cap</p>
    </div>

    <div class="stat">
        <h2>10</h2>
        <p>Minimum Players</p>
    </div>

    <div class="stat">
        <h2>$2M</h2>
        <p>Default Salary</p>
    </div>
</div>

<input type="text" id="search" class="search" placeholder="Search team or player...">

<div id="teams"></div>

<script>
const CAP = 58000000;

/* SAMPLE DATA (REPLACE WITH YOUR REAL DATA) */
const data = [
    {name:"zPud",team:"Spurs",salary:15000000},
    {name:"Slapclosed",team:"Lakers",salary:15000000},
    {name:"angentdrake",team:"Hornets",salary:18000000},
    {name:"Free Guy",team:"Free Agent",salary:2000000}
];

/* GROUP TEAMS */
const teams = {};

data.forEach(p=>{
    if(!teams[p.team]) teams[p.team]=[];
    teams[p.team].push(p);
});

/* RENDER */
function render(){
    const container = document.getElementById("teams");
    container.innerHTML = "";

    Object.keys(teams).forEach(team=>{
        const players = teams[team];
        const total = players.reduce((s,p)=>s+p.salary,0);

        const percent = Math.min((total/CAP)*100,100);

        const div = document.createElement("div");
        div.className="team-card";

        div.innerHTML = `
            <div class="team-header">
                <h2>${team}</h2>
                <h3>$${(total/1000000).toFixed(1)}M</h3>
            </div>

            <div class="progress">
                <div class="progress-bar" style="width:${percent}%"></div>
            </div>

            <div class="players">
                ${players.map(p=>`
                    <div class="player">
                        <span>${p.name}</span>
                        <span>${p.team==="Free Agent" ? '<span class="free-agent">FA</span>' : ''} $${(p.salary/1000000)}M</span>
                    </div>
                `).join("")}
            </div>
        `;

        div.onclick = ()=>{
            const list = div.querySelector(".players");
            list.style.display = list.style.display==="block" ? "none" : "block";
        };

        container.appendChild(div);
    });
}

document.getElementById("search").addEventListener("input",(e)=>{
    const value = e.target.value.toLowerCase();

    Object.keys(teams).forEach(team=>{
        teams[team] = teams[team].filter(p =>
            p.name.toLowerCase().includes(value) ||
            p.team.toLowerCase().includes(value)
        );
    });

    render();
});

render();
</script>

</body>
</html>
