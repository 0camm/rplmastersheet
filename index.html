<title>RPL Salary Caps</title>

<style>

    --red: #e8001d;
    --red-dim: rgba(232,0,29,.1);
    --bg: #060608;
    --surface: #0d0d10;
    --surface2: #111115;
    --border: rgba(255,255,255,.06);
    --muted: #555;
    --text: #e8e8ee;
    --cap: 58000000;

  html { scroll-behavior: smooth; }

    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 58px;
    background: rgba(6,6,8,.9);
    backdrop-filter: blur(20px);
  }

  .nav-cap {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .nav-cap strong { color: #fff; margin-left: 6px; }

  .page-header {
    padding: 52px 40px 36px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .page-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .page-eyebrow::before {
    content: '';
    width: 18px;
    height: 2px;
    background: var(--red);
    border-radius: 2px;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 5vw, 60px);
    letter-spacing: .03em;
    line-height: 1;
    color: #fff;
  }

  .page-meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .search-wrap {
    position: relative;
    width: 300px;
    flex-shrink: 0;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px 10px 40px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }

  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: rgba(232,0,29,.4); }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s, background .2s;
    letter-spacing: .02em;
  }

  .tab:hover { color: #fff; background: rgba(255,255,255,.05); }
  .tab.active { color: #fff; background: var(--surface2); }

  main { padding: 32px 40px 80px; }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s, transform .2s;
    cursor: pointer;
  }

  .team-card:hover { border-color: rgba(255,255,255,.12); transform: translateY(-2px); }
  .team-card.open { border-color: rgba(232,0,29,.25); }

  .team-card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
  }

  .team-logo-wrap {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .team-logo-wrap img { width: 38px; height: 38px; object-fit: contain; }

  .team-name-block { flex: 1; min-width: 0; }

  .team-name {
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-player-count { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .team-salary-block { text-align: right; flex-shrink: 0; }

  .team-salary-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: .04em;
    color: #fff;
  }

  .team-cap-pct { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .team-cap-pct.over { color: var(--red); }

  .cap-bar-wrap { padding: 0 20px 16px; }

  .cap-bar-track {
    height: 3px;
    background: rgba(255,255,255,.06);
    border-radius: 3px;
    overflow: hidden;
  }

  .cap-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--red);
    transition: width .4s ease;
  }

  .cap-bar-fill.safe { background: #00dc64; }
  .cap-bar-fill.warn { background: #f59e0b; }
  .cap-bar-fill.over { background: var(--red); }

  .team-toggle {
    padding: 0 20px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color .2s;
  }

  .team-card:hover .team-toggle { color: #888; }
  .team-card.open .team-toggle { color: var(--red); }

  .toggle-arrow { transition: transform .25s; }
  .team-card.open .toggle-arrow { transform: rotate(180deg); }

  .players-list { display: none; border-top: 1px solid var(--border); }
  .players-list.open { display: block; }

  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,.03);
    transition: background .15s;
  }

  .player-row:last-child { border-bottom: none; }
  .player-row:hover { background: rgba(255,255,255,.03); }

  .player-name { font-size: 13px; color: #ccc; font-weight: 500; }

  .player-salary {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .05em;
  }

  .fa-section { margin-top: 48px; }

  .fa-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .fa-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: .04em;
    color: #fff;
  }

  .fa-count {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .fa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }

  .fa-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color .2s, background .2s;
  }

  .fa-card:hover { background: var(--surface2); border-color: rgba(255,255,255,.1); }

  .fa-name { font-size: 13px; color: #bbb; font-weight: 500; }

  .fa-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: .05em;
    color: var(--red);
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
  .empty-text { font-size: 14px; }

  .hidden { display: none !important; }
</style>
</head>

function groupByTeam(players) {
  const map = {};
  teamList.forEach(t => map[t] = []);
  players.forEach(p => {
    if (map[p.team]) map[p.team].push(p);
  });
  return map;
}

function fmt(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  return '$' + n.toLocaleString();
}

function capColor(pct) {
  if (pct >= 100) return 'over';
  if (pct >= 80) return 'warn';
  return 'safe';
}

          </div>
          <div class="team-salary-block">
            <div class="team-salary-num">${fmt(total)}</div>
            <div class="team-cap-pct ${cls}">${pct.toFixed(0)}% of cap</div>
          </div>
        </div>
        <div class="cap-bar-wrap">
          <div class="cap-bar-track">
            <div class="cap-bar-fill ${cls}" style="width:${Math.min(pct,100)}%"></div>
          </div>
        </div>
        <div class="team-toggle">
          <svg class="toggle-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Roster
        </div>
        <div class="players-list${isOpen ? ' open' : ''}">
          ${(isOpen && !matchesTeam ? matchedPlayers : players).map(p => `
            <div class="player-row">
              <span class="player-name">${p.name}</span>
              <span class="player-salary">${fmt(p.salary)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  if (!anyVisible) {
    html = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🏀</div>
      <div class="empty-text">No teams or players match "<strong>${q}</strong>"</div>
    </div>`;
  }

  grid.innerHTML = html;
}

function renderFA() {
  const q = searchQuery.toLowerCase();
  const grid = document.getElementById('fa-grid');
  const countEl = document.getElementById('fa-count');

  // FIX: derive free agents directly from allPlayers
  const freeAgents = allPlayers.filter(p => p.team === 'Free Agent');

  const filtered = q
    ? freeAgents.filter(p => p.name.toLowerCase().includes(q))
    : freeAgents;

  countEl.textContent = `${filtered.length} player${filtered.length !== 1 ? 's' : ''}`;

  grid.innerHTML = filtered.length
    ? filtered.map(p => `
        <div class="fa-card">
          <span class="fa-name">${p.name}</span>
          <span class="fa-badge">${fmt(p.salary)}</span>
        </div>
      `).join('')
    : `<div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">🏀</div>
        <div class="empty-text">No free agents match "<strong>${q}</strong>"</div>
      </div>`;
}

function toggleCard(card) {
  const list = card.querySelector('.players-list');
  const isOpen = list.classList.contains('open');
  list.classList.toggle('open', !isOpen);
  card.classList.toggle('open', !isOpen);
}

function render() {
  if (currentTab === 'teams') {
    document.getElementById('view-teams').classList.remove('hidden');
    document.getElementById('view-fa').classList.add('hidden');
    renderTeams();
  } else {
    document.getElementById('view-teams').classList.add('hidden');
    document.getElementById('view-fa').classList.remove('hidden');
    renderFA();
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

render();
</script>
</body>
</html>
