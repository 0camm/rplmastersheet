<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0b0b0c;
    color:#e5e7eb;
}

/* HEADER */
header{
    padding:40px 20px 10px;
    text-align:center;
}

header h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:-0.5px;
}

header span{
    color:#ff0000;
}

/* SEARCH */
.search{
    display:block;
    margin:20px auto 40px;
    width:90%;
    max-width:600px;
    padding:14px;
    border-radius:12px;
    border:1px solid #1f1f23;
    background:#111114;
    color:white;
    outline:none;
    transition:.2s;
}

.search:focus{
    border-color:#ff0000;
}

/* GRID */
.grid{
    width:95%;
    max-width:1500px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:24px;
}

/* TEAM CARD */
.team{
    background:linear-gradient(145deg,#111114,#0f0f11);
    border-radius:18px;
    padding:20px;
    border:1px solid #1a1a1d;
    transition:.25s;
    cursor:pointer;
}

.team:hover{
    border-color:#2a2a2e;
    transform:translateY(-6px);
}

/* HEADER */
.team-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.team-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.team-logo{
    width:38px;
    height:38px;
    object-fit:contain;
}

/* TEAM NAME */
.team h3{
    font-size:16px;
    font-weight:600;
}

/* SALARY TEXT */
.salary{
    color:#9ca3af;
    font-size:14px;
}

/* CAP BAR */
.progress{
    margin-top:14px;
    height:6px;
    background:#1f1f23;
    border-radius:6px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#ff0000;
}

/* PLAYERS */
.players{
    margin-top:15px;
    display:none;
}

.player{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #1a1a1d;
    font-size:13px;
    color:#d1d5db;
}

.player:last-child{
    border-bottom:none;
}

/* FREE AGENTS */
.free-agent{
    margin-top:50px;
}

.free-agent h2{
    font-size:18px;
    margin-bottom:10px;
}

/* BADGE */
.badge{
    color:#ff0000;
    font-weight:600;
}
</style>

/* GROUP */
function groupTeams(){
    const teams = {};
    teamList.forEach(t=>teams[t]=[]);
    teams["Free Agent"] = [];

    players.forEach(p=>{
        if(!teams[p.team]) teams[p.team]=[];
        teams[p.team].push(p);
    });

    return teams;
}

function render(){
    const teams = groupTeams();
    const container = document.getElementById("teams");
    const faContainer = document.getElementById("fa");

    container.innerHTML = "";
    faContainer.innerHTML = "";

    Object.keys(teams).forEach(team=>{
        const list = teams[team];

        if(team === "Free Agent"){
            faContainer.innerHTML += `
                <div>
                    <h2>Free Agents</h2>
                    ${list.map(p=>`
                        <div class="player">
                            ${p.name}
                            <span class="badge">$2M</span>
                        </div>
                    `).join("")}
                </div>
            `;
            return;
        }

        const total = list.reduce((s,p)=>s+p.salary,0);
        const percent = Math.min((total/CAP)*100,100);

        const div = document.createElement("div");
        div.className="team";

        div.innerHTML = `
            <div class="team-header">
                <div class="team-info">
                    <img class="team-logo" src="${logos[team]}">
                    <h3>${team}</h3>
                </div>
                <span class="salary">$${(total/1000000).toFixed(1)}M</span>
            </div>

            <div class="progress">
                <div class="progress-bar" style="width:${percent}%"></div>
            </div>

            <div class="players">
                ${list.map(p=>`
                    <div class="player">
                        ${p.name}
                        <span>$2M</span>
                    </div>
                `).join("")}
            </div>
        `;

        div.onclick = ()=>{
            const playersDiv = div.querySelector(".players");
            playersDiv.style.display = playersDiv.style.display==="block"?"none":"block";
        };

        container.appendChild(div);
    });
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
    const val = e.target.value.toLowerCase();

    players = players.filter(p =>
        p.name.toLowerCase().includes(val) ||
        p.team.toLowerCase().includes(val)
    );

    render();
});

render();
