<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPL Salary Database</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#0f172a,#020617);
    color:white;
}

header{
    padding:40px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
}

header h1{
    font-size:50px;
    font-weight:900;
    letter-spacing:2px;
}

header p{
    opacity:.7;
    margin-top:10px;
}

.container{
    width:90%;
    max-width:1400px;
    margin:auto;
    padding:30px 0;
}

.search-box{
    margin-bottom:30px;
}

.search-box input{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    background:#111827;
    color:white;
    font-size:16px;
}

.salary-section{
    margin-bottom:35px;
}

.section-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
    padding:15px;
    border-left:5px solid #3b82f6;
    background:rgba(255,255,255,.03);
    border-radius:12px;
}

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.player-card{
    background:linear-gradient(180deg,#111827,#1e293b);
    border:1px solid rgba(255,255,255,.05);
    border-radius:20px;
    padding:20px;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.player-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(45deg,transparent,rgba(255,255,255,.05),transparent);
    transform:translateX(-100%);
    transition:.5s;
}

.player-card:hover::before{
    transform:translateX(100%);
}

.player-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.player-name{
    font-size:24px;
    font-weight:800;
}

.player-team{
    margin-top:10px;
    opacity:.8;
}

.salary{
    margin-top:15px;
    font-size:22px;
    font-weight:900;
    color:#22c55e;
}

.badge{
    display:inline-block;
    margin-top:15px;
    padding:8px 12px;
    border-radius:50px;
    background:#dc2626;
    font-size:12px;
    font-weight:700;
}

.team-logo{
    width:50px;
    height:50px;
    object-fit:contain;
    margin-top:15px;
    transition:.3s;
}

.player-card:hover .team-logo{
    transform:rotate(8deg) scale(1.1);
}

.stats-bar{
    display:flex;
    gap:20px;
    margin:30px 0;
}

.stat-card{
    flex:1;
    background:#111827;
    padding:20px;
    border-radius:16px;
    text-align:center;
}

.stat-card h2{
    font-size:28px;
}

.stat-card p{
    opacity:.7;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<header>
    <h1>RPL SEASON 10 CAP SHEET</h1>
    <p>League Contract Database</p>
</header>

<div class="container">

    <div class="stats-bar">
        <div class="stat-card">
            <h2>$58M</h2>
            <p>Team Cap</p>
        </div>

        <div class="stat-card">
            <h2>10</h2>
            <p>Minimum Players</p>
        </div>

        <div class="stat-card">
            <h2>2M</h2>
            <p>Non-Listed Salary</p>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="Search players or teams...">
    </div>

    <div id="salaryContainer"></div>

</div>

<script>
const salaryData = {
    "20M":[
        {name:"Player One",team:"Free Agent",salary:"20M",logo:""}
    ],
    "18M":[
        {name:"angentdrake",team:"Hornets",salary:"18M",logo:""}
    ],
    "15M":[
        {name:"zPud",team:"Spurs",salary:"15M",logo:""},
        {name:"Slapclosed",team:"Lakers",salary:"15M",logo:""}
    ],
    "12M":[
        {name:"3ptaether",team:"Mavericks",salary:"12M",logo:""}
    ]
};

const container = document.getElementById("salaryContainer");

function render(data){
    container.innerHTML = "";

    Object.keys(data).forEach(tier=>{
        const section = document.createElement("div");
        section.className = "salary-section";

        section.innerHTML = `
            <div class="section-title">${tier} Players</div>
            <div class="players-grid">
                ${data[tier].map(player=>`
                    <div class="player-card">
                        <div class="player-name">${player.name}</div>
                        <div class="player-team">${player.team}</div>
                        <div class="salary">$${player.salary}</div>
                        ${
                            player.team === "Free Agent"
                            ? '<div class="badge">FREE AGENT</div>'
                            : ''
                        }
                    </div>
                `).join("")}
            </div>
        `;

        container.appendChild(section);
    });
}

document.getElementById("search").addEventListener("input",(e)=>{
    const value = e.target.value.toLowerCase();

    const filtered = {};

    Object.keys(salaryData).forEach(tier=>{
        filtered[tier] = salaryData[tier].filter(player =>
            player.name.toLowerCase().includes(value) ||
            player.team.toLowerCase().includes(value)
        );
    });

    render(filtered);
});

render(salaryData);
</script>

</body>
</html>
