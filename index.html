<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter';}

body{
    background:
    radial-gradient(circle at 20% 0%, rgba(255,0,0,.35), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(255,0,0,.25), transparent 40%),
    linear-gradient(#fafafa,#f3f4f6);
    color:#111;
    overflow-x:hidden;
}

/* CURSOR */
#cursor{
    position:fixed;
    width:260px;
    height:260px;
    background:radial-gradient(circle, rgba(255,0,0,.25), transparent 70%);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:0;
}

/* HEADER */
header{
    padding:50px 20px 20px;
    text-align:center;
}

header h1{
    font-size:48px;
    font-weight:900;
    color:#ff0000;
}

/* SEARCH */
.search{
    display:block;
    margin:20px auto 40px;
    width:90%;
    max-width:650px;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(255,0,0,.25);
    background:white;
    transition:.3s;
}

.search:focus{
    border-color:#ff0000;
    box-shadow:0 0 20px rgba(255,0,0,.3);
}

/* GRID */
.grid{
    width:95%;
    max-width:1500px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:26px;
    position:relative;
    z-index:2;
}

/* TEAM CARD */
.team{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    border-radius:22px;
    padding:22px;
    border:1px solid rgba(255,0,0,.25);
    transition:.4s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

/* shine */
.team::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform:translateX(-100%);
}

.team::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:22px;
    background:linear-gradient(120deg, transparent, rgba(255,0,0,.6), transparent);
    opacity:0;
}

.team:hover::before{
    transform:translateX(100%);
    transition:.7s;
}

.team:hover::after{
    opacity:1;
    transition:.4s;
}

.team:hover{
    transform:translateY(-12px) scale(1.02);
    box-shadow:0 30px 80px rgba(255,0,0,.35);
}

/* HEADER */
.team-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.team-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.team-logo{
    width:44px;
    height:44px;
    object-fit:contain;
    background:white;
    padding:6px;
    border-radius:10px;
}

/* CAP BAR */
.progress{
    margin-top:16px;
    height:10px;
    background:#eee;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,#ff0000,#ff4d4d);
}

/* PLAYERS */
.players{
    margin-top:15px;
    display:none;
}

.player{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #eee;
    transition:.2s;
}

.player:hover{
    background:rgba(255,0,0,.08);
}

/* FREE AGENTS */
.free-agent{
    margin-top:50px;
}

.free-agent h2{
    color:#ff0000;
    margin-bottom:10px;
}

/* BADGE */
.badge{
    background:#ff0000;
    color:white;
    padding:4px 10px;
    border-radius:8px;
    font-size:11px;
}

/* GROUP */
function groupTeams(){
    const teams = {};
    teamList.forEach(t=>teams[t]=[]);
    teams["Free Agent"] = [];

    players.forEach(p=>{
        if(!teams[p.team]) teams[p.team]=[];
        teams[p.team].push(p);
    });

    return teams;
}

function render(){
    const teams = groupTeams();
    const container = document.getElementById("teams");
    const faContainer = document.getElementById("fa");

    container.innerHTML = "";
    faContainer.innerHTML = "";

    Object.keys(teams).forEach(team=>{
        const list = teams[team];

        if(team === "Free Agent"){
            faContainer.innerHTML += `
                <div>
                    <h2>Free Agents</h2>
                    ${list.map(p=>`
                        <div class="player">
                            ${p.name}
                            <span class="badge">$2M</span>
                        </div>
                    `).join("")}
                </div>
            `;
            return;
        }

        const total = list.reduce((s,p)=>s+p.salary,0);
        const percent = Math.min((total/CAP)*100,100);

        const div = document.createElement("div");
        div.className="team";

        div.innerHTML = `
            <div class="team-header">
                <div class="team-info">
                    <img class="team-logo" src="${logos[team] || logos['Free Agent']}">
                    <h3>${team}</h3>
                </div>
                <h3>$${(total/1000000).toFixed(1)}M</h3>
            </div>

            <div class="progress">
                <div class="progress-bar" style="width:${percent}%"></div>
            </div>

            <div class="players">
                ${list.map(p=>`
                    <div class="player">
                        ${p.name}
                        <span>$2M</span>
                    </div>
                `).join("")}
            </div>
        `;

        div.onclick = ()=>{
            const playersDiv = div.querySelector(".players");
            playersDiv.style.display = playersDiv.style.display==="block"?"none":"block";
        };

        container.appendChild(div);
    });
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
    const val = e.target.value.toLowerCase();

    players = players.filter(p =>
        p.name.toLowerCase().includes(val) ||
        p.team.toLowerCase().includes(val)
    );

    render();
});

/* CURSOR */
document.addEventListener("mousemove", e=>{
    const c = document.getElementById("cursor");
    c.style.left = e.clientX+"px";
    c.style.top = e.clientY+"px";
});

render();
